<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{{ appinfo.app_name }}</title>
    <link rel="icon" type="image/png" href="/static/icon.png">

    <!-- Dynamische Werte als CSS-Variablen -->
    <style>
        :root {
            --display-width: {{ display_width }}px;
            --display-height: {{ display_height }}px;
            --cover-size: {{ cover_size }}px;
        }
    </style>

    <!-- Externes CSS (kein Jinja darin) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="title-row">
    <img src="/static/PlayingonSONOS.png" class="logo" alt="Logo">
    <h1>{{ appinfo.app_name }}</h1>
</div>

<div class="content">
    <div class="room-frame">
        <div class="room">

            <!-- Raumwahl -->
            {% if rooms|length > 1 %}
            <div class="control-row room-buttons">
                {% for r in rooms %}
                    <a class="button small {% if r.room == active_room %}active-room{% endif %}{% if r.state == 'PLAYING' %} playing-room{% endif %}"
                       href="/setroom/{{ r.room }}">
                        {{ r.alias }}
                    </a>
                {% endfor %}
            </div>
            {% else %}
            <h2 id="roomname">{{ rooms[0].alias }}</h2>
            {% endif %}

            <!-- Album Art -->
            <img id="cover" class="cover" src="" alt="Cover">

            <h3 id="title"></h3>
            <h4 id="artist"></h4>

            <!-- Statusbar -->
            <div class="control-row">
                <div class="progress-container">
                    <div id="progress" class="progress-bar"></div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="control-row">
                <a class="button small" href="/volume_down">−</a>
                <a class="button small" href="/previous">«</a>
                <a id="togglebtn" class="button small" href="/toggle">Play</a>
                <a class="button small" href="/next">»</a>
                <a class="button small" href="/volume_up">+</a>
            </div>

        </div>
    </div>

    <footer class="local-footer">
        Version {{ appinfo.version }} — © {{ appinfo.author }}
    </footer>
</div>

<script>
async function updateData() {
    try {
        const response = await fetch("/api/state");
        const data = await response.json();

        const active = data.active;
        const rooms = data.rooms;

        const room = rooms.find(r => r.room === active);
        if (!room) return;

        document.getElementById("title").innerText = room.title || "";
        document.getElementById("artist").innerText = room.artist || "";
        document.getElementById("cover").src = room.album_art || "";

        const pct = room.duration > 0 ? (room.position / room.duration * 100) : 0;
        document.getElementById("progress").style.width = pct + "%";

        document.getElementById("togglebtn").innerText =
            room.state === "PLAYING" ? "Pause" : "Play";

    } catch (e) {
        console.log("Update error:", e);
    }
}

updateData();
setInterval(updateData, 1000);
</script>

</body>
</html>
