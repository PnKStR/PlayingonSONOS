<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin – Räume</title>
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-top: 0;
        }
        .room-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        input[type="text"] {
            padding: 6px 8px;
            border-radius: 6px;
            border: none;
            min-width: 180px;
        }
        label {
            min-width: 80px;
        }
        button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: #00aa55;
            color: black;
            font-weight: bold;
            margin-top: 15px;
        }
        .delete-label {
            font-size: 12px;
            color: #ff6666;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a {
            color: #00ffcc;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>Admin – Räume verwalten</h1>
    <a href="/logout">Logout</a>
</div>

<form action="/admin/save" method="POST">
    <h2>Bestehende Räume</h2>

    {% for r in rooms %}
        <div class="room-row">
            <label>Raum {{ loop.index }}:</label>

            <input type="text" name="name_{{ loop.index }}" value="{{ r.name }}" placeholder="Raumname (Sonos)">
            <input type="text" name="alias_{{ loop.index }}" value="{{ r.alias }}" placeholder="Alias (Anzeige)">

            <input type="hidden" name="old_name_{{ loop.index }}" value="{{ r.name }}">

            <label class="delete-label">
                <input type="checkbox" name="delete_{{ loop.index }}"> löschen
            </label>
        </div>
    {% endfor %}

    <input type="hidden" name="room_count" value="{{ rooms|length }}">

    <h2>Neuen Raum hinzufügen</h2>
    <div class="room-row">
        <label>Neu:</label>
        <input type="text" name="new_name" placeholder="Raumname (Sonos)">
        <input type="text" name="new_alias" placeholder="Alias (Anzeige)">
    </div>

    <button type="submit">Speichern</button>
</form>

</body>
</html>
