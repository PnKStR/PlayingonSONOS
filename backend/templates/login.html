<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 120px;
        }
        input {
            padding: 10px;
            margin: 10px;
            width: 220px;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #00aa55;
            color: black;
            font-weight: bold;
        }
        .error {
            color: #ff4444;
        }
        .logo {
            height: 32px;
            vertical-align: middle;
            margin-right: 10px;
        }
        .footer {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

<h2>
    <img src="/static/icon.png" class="logo">
    Admin Login
</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
    <input type="text" name="username" placeholder="Benutzername"><br>
    <input type="password" name="password" placeholder="Passwort"><br>
    <button type="submit">Login</button>
</form>

<div class="footer">
    <p>{{ appinfo.app_name }} – Version {{ appinfo.version }}</p>
</div>

</body>
</html>
